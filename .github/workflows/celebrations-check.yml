name: Daily Celebrations Check

on:
  schedule:
    # 09:30 UTC. GitHub's shared runners queue scheduled jobs under load and this
    # one has been landing 3-6 hours late, so the time is picked to absorb that:
    # on time it is 4:30/5:30 AM ET, and a typical delay puts it mid-morning.
    # Either way it stays on the correct Eastern calendar day in both EST and EDT,
    # which is what the date matching in celebrations-check.js depends on.
    - cron: '30 9 * * *'

  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  check-celebrations:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm install googleapis axios
        
    - name: Run celebrations check
      env:
        SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        CALENDAR_IDS: ${{ secrets.CALENDAR_IDS }}
        CALENDAR_NAME_MAP: ${{ secrets.CALENDAR_NAME_MAP }}
        # Use testing channel for manual runs, production channel for scheduled runs
        SLACK_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && '#celebrations-bot-test' || secrets.SLACK_CHANNEL }}
      run: |
        echo "🚀 Running daily celebrations check..."
        echo "📋 Trigger: ${{ github.event_name }}"
        echo "📺 Channel: ${{ github.event_name == 'workflow_dispatch' && '#celebrations-bot-test' || secrets.SLACK_CHANNEL || '#celebrations-bot-test' }}"
        node celebrations-check.js
        
    - name: Log completion
      if: always()
      run: |
        echo "✅ Celebrations check workflow completed"
        echo "📅 Run date: $(date)"
